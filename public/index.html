<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI voice assistant- Niko</title>
      <script src="https://cdn.tailwindcss.com"></script>
      <style>
       .dot {
      width: 12px;
      height: 12px;
      margin: 0 4px;
      background-color: #8b5cf6;
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: scale(0);
      } 40% {
        transform: scale(1);
      }
    }
      </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg text-center w-full max-w-md">
        <h1 class="text-2xl font-bold mb-4 text-purple-600"> 🎙️ Talk to Niko</h1>

        <button onclick="startRecognition()" id="talkBtn" class="bg-purple-600 text-white px-6 py-3 rounded-lg hover:bg-purple-700 transition">
            Start Talking
        </button>

        <div id="animationContainer" class="mt-6 hidden flex justify-center items-center">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>  
        </div>
        <p id="displayText" class="mt-6 text-gray-800"> Press the button and speak....</p>
        <audio id="audio"  class="mt-4 w-full" controls style="display: none;"></audio>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
