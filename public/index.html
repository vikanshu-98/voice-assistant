<body class="bg-[#0e0e23] flex flex-col items-center justify-center min-h-screen text-white font-sans">
  <div id="micButton" onclick="startRecognition()" class="relative w-40 h-40 rounded-full flex items-center justify-center cursor-pointer transition-all duration-300 ease-in-out hover:scale-105 group">
    <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-purple-500 via-blue-400 to-pink-500 blur-xl opacity-70 animate-ping group-[.active]:animate-pulse">
    </div>
    <div class="relative w-32 h-32 bg-[#15152f] rounded-full flex items-center justify-center shadow-[0_0_30px_rgba(138,43,226,0.5),0_0_60px_rgba(0,191,255,0.3)] transition-all duration-300 group-[.active]:shadow-[0_0_50px_rgba(138,42,226,0.7),0_0_100px_rgba(0,191,255,0.5)]">
      <i class="fas fa-microphone text-white text-4xl"></i>
    </div>
  </div>
  <p id="displayText" class="mt-8 text-center text-lg"> click the mic to speak...</p>
  <audio id="audio" class="mt-4 hidden"></audio>
  <script src="js/main.js"></script>
</body>
